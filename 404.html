<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Not on the Menu | WHISKORA</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
	<style>
		:root { --cream: #f8f3eb; --espresso: #33231f; --cocoa: #654840; --rose: #bc7264; --paper: #fffdf9; --serif: "Cormorant Garamond", Georgia, serif; --sans: "Manrope", Arial, sans-serif; }
		* { box-sizing: border-box; } body { background: var(--cream); color: var(--espresso); font-family: var(--sans); margin: 0; min-height: 100vh; }
		.page { align-items: center; display: flex; justify-content: center; min-height: 100vh; overflow: hidden; padding: 40px 24px; position: relative; text-align: center; }
		.page::before { background: #e9dacb; border-radius: 50%; content: ""; height: 540px; left: -180px; position: absolute; top: -190px; width: 540px; }
		.page::after { background: #e6c6bd; border-radius: 50%; bottom: -240px; content: ""; height: 500px; position: absolute; right: -180px; width: 500px; }
		.content { max-width: 620px; position: relative; z-index: 1; }
		.brand { align-items: center; display: inline-flex; gap: 10px; margin-bottom: 65px; }
		.mark { align-items: center; border: 1px solid var(--espresso); border-radius: 50%; display: flex; font-family: var(--serif); font-size: 1.3rem; height: 38px; justify-content: center; width: 38px; }
		.brand-name { font-family: var(--serif); font-size: 1.4rem; font-weight: 700; }
		.cake { font-size: 5.5rem; line-height: 1; margin-bottom: 20px; }
		.code { color: var(--rose); font-size: .72rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
		h1 { font-family: var(--serif); font-size: clamp(3.8rem, 9vw, 6.8rem); font-weight: 600; letter-spacing: -.04em; line-height: .88; margin: 18px 0 24px; }
		p { color: var(--cocoa); font-size: 1rem; margin: 0 auto 32px; max-width: 410px; }
		.button { background: var(--espresso); color: var(--paper); display: inline-block; padding: 15px 24px; transition: background .2s, transform .2s; }
		.button:hover { background: var(--rose); transform: translateY(-2px); }
	</style>
</head>
<body>
	<main class="page"><div class="content"><a class="brand" href="index.html"><span class="mark">W</span><span class="brand-name">WHISKORA</span></a><p class="tagline">Whisk Your Imagination to Life.</p><div class="cake" aria-hidden="true">🍰</div><span class="code">404 · A missing slice</span><h1>Oops! This page isn't on our menu.</h1><p>It looks like this little corner of the bakery has gone missing. Let's get you back to something sweet.</p><a class="button" href="index.html">Return to the bakery <span aria-hidden="true">↗</span></a></div></main>
</body>
</html>
